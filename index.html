<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the app use the full iPhone screen (notch area) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1B3A">
  <title>McGill Map</title>

  <!-- Leaflet: the free map library. Its CSS must load before our own. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- MapLibre draws the clean "Positron" map style (free, no API key) -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hidden SVG that holds shared drawing pieces (gradients + glow) for the zones.
       app.js adds one gradient per building in here. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs id="zone-defs">
      <filter id="zone-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <div id="app">

    <!-- ========== HEADER ========== -->
    <header class="header">
      <h1 class="title">McGill Map</h1>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search-input" type="search" placeholder="Search a building..." autocomplete="off" aria-label="Search a building">
        <button id="menu-btn" class="icon-btn" aria-label="Map options" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
      </div>

      <!-- Search results dropdown (filled by app.js) -->
      <div id="search-results" class="dropdown" hidden></div>

      <!-- Options menu opened by the filter icon -->
      <div id="menu" class="dropdown menu" hidden>
        <label class="menu-row">
          <span>Show zones</span>
          <input type="checkbox" id="zones-toggle" class="switch" checked>
        </label>
        <button id="reset-btn" class="menu-row danger">Reset progress</button>
      </div>
    </header>

    <!-- ========== MAP AREA ========== -->
    <main class="map-wrap">
      <div id="map"></div>

      <!-- Filter chips (left) + progress pill (right) floating on top of the map -->
      <div class="map-top">
        <div class="chips" role="group" aria-label="Filter buildings">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="unlocked">Unlocked</button>
          <button class="chip" data-filter="locked">Locked</button>
        </div>
        <div class="progress-pill" aria-live="polite">
          <div class="progress-text"><strong id="count">0</strong> / <span id="total">0</span> unlocked</div>
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
      </div>

      <!-- Shown only while test mode is on -->
      <div class="test-banner">Test mode · tap the map to move</div>

      <!-- Floating round buttons -->
      <div class="fabs">
        <button id="test-btn" class="fab" aria-label="Test mode" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="3"/><path d="M12 9v6"/><path d="M6 15h12l1.5 5h-15z"/></svg>
        </button>
        <button id="recenter-btn" class="fab" aria-label="Center on my location">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M21 3L3 10.5l7.5 2.9L13.5 21z"/></svg>
        </button>
      </div>

      <!-- Small message bubble ("Coming soon", errors...) -->
      <div id="toast" class="toast" role="status"></div>

      <!-- ========== BOTTOM SHEET (building card) ========== -->
      <section id="sheet" class="sheet" aria-hidden="true">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div class="sheet-titles">
            <h2 id="sheet-title"></h2>
            <p id="sheet-sub"></p>
          </div>
          <div class="sheet-actions">
            <button id="share-btn" class="round-btn" aria-label="Share">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
            </button>
            <button id="fav-btn" class="round-btn" aria-label="Favorite" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.3-9.4A5 5 0 0 1 12 7a5 5 0 0 1 9.3 3.6C19.5 15.4 12 20 12 20z"/></svg>
            </button>
            <button id="dir-btn" class="round-btn primary" aria-label="Directions">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19v-5a4 4 0 0 1 4-4h10"/><path d="M15 6l4 4-4 4"/></svg>
            </button>
          </div>
        </div>
        <div id="sheet-tags" class="tags"></div>
        <div class="stats">
          <div class="stat">
            <div class="stat-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </div>
            <div><div id="stat-dist" class="stat-value">—</div><div class="stat-label">from you</div></div>
          </div>
          <div class="stat">
            <div class="stat-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            </div>
            <div><div id="stat-date" class="stat-value">—</div><div id="stat-date-label" class="stat-label"></div></div>
          </div>
        </div>
      </section>
    </main>

    <!-- ========== TAB BAR ========== -->
    <nav class="tabbar">
      <button class="tab active" data-tab="map">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
        Map
      </button>
      <button class="tab" data-tab="explore">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
        Explore
      </button>
      <button class="tab" data-tab="progress">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5.5a2.5 2.5 0 0 0 2.6 3.6M16 6h2.5a2.5 2.5 0 0 1-2.6 3.6M12 13v4M8.5 20h7M10 17h4"/></svg>
        Progress
      </button>
      <button class="tab" data-tab="profile">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        Profile
      </button>
    </nav>

    <!-- ========== "UNLOCKED!" CELEBRATION ========== -->
    <div id="celebrate" class="celebrate" aria-live="assertive">
      <div class="confetti" id="confetti"></div>
      <div class="celebrate-card">
        <div id="celebrate-icon" class="celebrate-icon"></div>
        <p class="celebrate-kicker">Building unlocked!</p>
        <h2 id="celebrate-name"></h2>
        <p id="celebrate-progress" class="celebrate-progress"></p>
      </div>
    </div>
  </div>

  <!-- Scripts. Order matters: Leaflet first, then our data, then our logic. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
